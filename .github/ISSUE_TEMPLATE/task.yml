name: Development task
description: Create a focused implementation task for CodeLobby
title: "[Area] "
labels: []
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be implemented or changed?
      placeholder: Describe one focused outcome.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend
        - Web
        - Runner
        - Infrastructure
        - Cross-cutting
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true for this task to be considered done?
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Technical notes
      description: Optional implementation notes, API contracts, dependencies or links.
